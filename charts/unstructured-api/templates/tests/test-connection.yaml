{{- if .Values.service.enabled -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "unstructured-api.fullname" . }}-test-healthcheck"
  labels:
    {{- include "unstructured-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: healthcheck
      image: curlimages/curl:8.11.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - curl
      args:
        - --fail
        - --silent
        - --show-error
        - "http://{{ include "unstructured-api.fullname" . }}:{{ .Values.service.port }}/healthcheck"
{{- end }}
