name: CI — acceptance

# Proves every acceptance scenario binds to a step and is collected. It runs no scenario against an
# environment: those need staging's secrets and a live partition API, which a pull request check
# should not.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Acceptance contract
    # A fork's pull request gets no OIDC token, so it could not install the framework.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: acceptance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: acceptance/.nvmrc
          cache: npm
          cache-dependency-path: acceptance/package-lock.json

      # @utic/acceptance-core is on the private Azure Artifacts feed; acceptance/.npmrc reads the
      # token from AZURE_ARTIFACTS_TOKEN. This is a public repo, which GitHub does not allow to use
      # actions from the internal github-workflows repo, so the token is minted inline.
      - name: Log in to Azure with the package feed reader
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: a74a6a24-379b-4810-b01a-00707cb7decf
          tenant-id: dcb38522-c289-4665-a9d8-c4995b630804
          allow-no-subscriptions: true

      - name: Mint package feed token
        id: ado
        run: |
          token=$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)
          echo "::add-mask::${token}"
          echo "AZ_DEVOPS_TOKEN=${token}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        env:
          AZURE_ARTIFACTS_TOKEN: ${{ steps.ado.outputs.AZ_DEVOPS_TOKEN }}
        run: npm ci

      # The compile a published test package needs; a type error here would ship no steps.
      - name: Build the acceptance step sources
        run: npm run build

      # bddgen fails on an unbound step, so a feature cannot land depending on a step nobody wrote.
      # Staging, because that is where this suite's scenarios run; bddgen and --list run no global
      # setup, so no secret is fetched.
      - name: Generate Playwright tests from every scenario
        env:
          TEST_ENV: staging
          TEST_SECRETS_ID: ""
        run: npx --no-install bddgen

      - name: List the collected scenarios
        env:
          TEST_ENV: staging
          TEST_SECRETS_ID: ""
        run: npx --no-install playwright test --list
